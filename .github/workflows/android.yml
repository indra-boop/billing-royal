name: Android CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Build debug pada setiap push + unit test, lalu unggah app-debug.apk sebagai artifact.
  build-debug:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          # Paket legacy "tools" sudah tidak ada di cmdline-tools 16.0 (SDK baru dari setup-android).
          # Cukup platform-tools; AGP mengunduh platform serta build-tools yang dibutuhkan.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit test
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Unggah app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Release ditandatangani; hanya lewat "Run workflow" (workflow_dispatch).
  # Secrets yang dibutuhkan: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          # Paket legacy "tools" sudah tidak ada di cmdline-tools 16.0 (SDK baru dari setup-android).
          # Cukup platform-tools; AGP mengunduh platform serta build-tools yang dibutuhkan.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit test
        run: ./gradlew test --stacktrace

      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "Secret KEYSTORE_BASE64 belum diatur." >&2
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "${GITHUB_ENV}"

      - name: Build release APK (ditandatangani)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verifikasi tanda tangan APK
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -d "${ANDROID_HOME}"/build-tools/*/ | sort -V | tail -n1)apksigner"
          "${APKSIGNER}" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Unggah app-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Hapus keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"
