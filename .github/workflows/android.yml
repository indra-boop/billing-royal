name: Android CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  # Hanya push biasa yang boleh saling membatalkan; run release (workflow_dispatch) TIDAK pernah dibatalkan di tengah signing.
  cancel-in-progress: ${{ github.event_name == 'push' }}

# Semua action di-pin ke SHA commit (diverifikasi lewat `gh api repos/<owner>/<repo>/commits/<tag>`):
#   actions/checkout            v4.4.0  11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-java          v4.9.1  cf277c60eb25467037889841efdb72551f06f6c3
#   android-actions/setup-android v3.2.2 9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
#   gradle/actions              v4.4.3  ed408507eac070d1f99cc633dbcf757c94c7933a
#     (setup-gradle dan wrapper-validation berasal dari repo/commit yang sama; path wrapper-validation/action.yml
#      terverifikasi ada pada SHA itu lewat `gh api repos/gradle/actions/contents/wrapper-validation/action.yml?ref=<sha>`)
#   actions/upload-artifact     v4.6.2  ea165f8d65b6e75b540449e92b4886f43607fa02

jobs:
  # Build debug pada setiap push + unit test, lalu unggah app-debug.apk sebagai artifact (disimpan singkat).
  build-debug:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Unit test
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Unggah app-debug.apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # Release ditandatangani; HANYA lewat "Run workflow" pada cabang main dan environment `release`
  # (buat environment "release" di Settings > Environments, pasang required reviewers, dan simpan
  # secret KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD di environment itu, bukan di repo).
  # BASE_URL produksi: variabel environment PROD_BASE_URL (Settings > Environments > release > Variables).
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      # Job release hanya MEMBACA cache (cache-read-only): cache yang dibangun dari push biasa tidak boleh ditulis ulang
      # oleh job yang memegang secret signing.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: true

      - name: Unit test
        run: ./gradlew test --stacktrace

      # Keempat secret signing diperiksa sekaligus (pesan jelas, gagal sebelum build). Berkas keystore dibuat dengan
      # umask 077 dan jalurnya TIDAK diekspor ke langkah lain (hanya lewat env pada langkah build).
      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${KEYSTORE_BASE64:-}" ] || missing="${missing} KEYSTORE_BASE64"
          [ -n "${KEYSTORE_PASSWORD:-}" ] || missing="${missing} KEYSTORE_PASSWORD"
          [ -n "${KEY_ALIAS:-}" ] || missing="${missing} KEY_ALIAS"
          [ -n "${KEY_PASSWORD:-}" ] || missing="${missing} KEY_PASSWORD"
          if [ -n "${missing}" ]; then
            echo "Secret signing belum diatur:${missing}" >&2
            exit 1
          fi
          umask 077
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"

      # Gradle menolak build release bila BASE_URL masih placeholder (task verifyReleaseConfig) atau
      # bukan https:// berakhiran "/". PROD_BASE_URL (opsional) menimpa nilai gradle.properties.
      - name: Build release APK (ditandatangani)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
        run: |
          set -euo pipefail
          if [ -n "${PROD_BASE_URL:-}" ]; then
            ./gradlew assembleRelease --stacktrace "-Pbilling.baseUrl.release=${PROD_BASE_URL}"
          else
            ./gradlew assembleRelease --stacktrace
          fi

      - name: Verifikasi tanda tangan APK
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -d "${ANDROID_HOME}"/build-tools/*/ | sort -V | tail -n1)apksigner"
          "${APKSIGNER}" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Unggah app-release.apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-release.apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # Mapping R8 untuk membaca stack trace rilis.
      - name: Unggah mapping R8
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Hapus keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"
