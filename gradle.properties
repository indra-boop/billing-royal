org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# Konfigurasi aplikasi (satu tempat). Dapat ditimpa lewat:
#   ./gradlew assembleDebug -Pbilling.applicationId=com.contoh.app -Pbilling.baseUrl.debug=https://...
# ---------------------------------------------------------------------------
# applicationId (placeholder, ganti di sini saja)
billing.applicationId=id.jerco.billingroyal
# BASE_URL per build type (placeholder, WAJIB diganti). Harus HTTPS dan diakhiri "/".
billing.baseUrl.debug=https://STAGING-HOST/billing/api/v1/
billing.baseUrl.release=https://PROD-HOST/billing/api/v1/
# Feature flag (default FALSE)
billing.flag.markPaid=false
billing.flag.cancelInvoice=false
billing.flag.priceOverride=false
billing.flag.delete=false
